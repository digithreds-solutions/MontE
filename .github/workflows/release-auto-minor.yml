name: Auto Release on Commit (Minor Version)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/workflows/release-manual-major.yml'

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-release:
    name: Bump Minor & Publish Release
    # Prevent infinite loop if commit was generated by CI release
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'chore(release):')"
    runs-on: macos-14
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Bump Minor Version
        id: versioning
        run: |
          ./scripts/bump-version.sh minor
          NEW_VER=$(cat VERSION | tr -d '[:space:]')
          echo "NEW_VERSION=$NEW_VER" >> $GITHUB_OUTPUT
          echo "TAG=v$NEW_VER" >> $GITHUB_OUTPUT

      - name: Build Mont-E Release DMG
        run: |
          ./build.sh "${{ steps.versioning.outputs.NEW_VERSION }}"

      - name: Verify Generated DMG
        run: |
          ls -la Packages/
          test -f "Packages/Monte-${{ steps.versioning.outputs.NEW_VERSION }}.dmg"

      - name: Commit & Push Version Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add VERSION Info.plist Sources/Monte/Resources/Info.plist Packages/README.md
          git commit -m "chore(release): auto bump minor to ${{ steps.versioning.outputs.TAG }} [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Create Git Tag
        run: |
          git tag -a "${{ steps.versioning.outputs.TAG }}" -m "Automated Release ${{ steps.versioning.outputs.TAG }}"
          git push origin "${{ steps.versioning.outputs.TAG }}"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.TAG }}
          name: "Mont-E ${{ steps.versioning.outputs.TAG }}"
          generate_release_notes: true
          files: |
            Packages/Monte-${{ steps.versioning.outputs.NEW_VERSION }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
