name: Manual Release (Major / Custom)

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version Bump Type'
        required: true
        default: 'major'
        type: choice
        options:
          - major
          - minor
          - patch
          - custom
      custom_version:
        description: 'Custom Version (Only used if "custom" is selected above, e.g. 3.0.0)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-14
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Calculate & Bump Version
        id: versioning
        run: |
          BUMP="${{ inputs.bump_type }}"
          if [[ "$BUMP" == "custom" ]]; then
            TARGET_VERSION="${{ inputs.custom_version }}"
            if [[ -z "$TARGET_VERSION" ]]; then
              echo "Error: custom_version cannot be empty when custom bump_type is selected." >&2
              exit 1
            fi
            ./scripts/bump-version.sh "$TARGET_VERSION"
          else
            ./scripts/bump-version.sh "$BUMP"
          fi

          NEW_VER=$(cat VERSION | tr -d '[:space:]')
          echo "NEW_VERSION=$NEW_VER" >> $GITHUB_OUTPUT
          echo "TAG=v$NEW_VER" >> $GITHUB_OUTPUT

      - name: Build Mont-E Release DMG
        run: |
          ./build.sh "${{ steps.versioning.outputs.NEW_VERSION }}"

      - name: Verify Generated DMG
        run: |
          ls -la Packages/
          test -f "Packages/Monte-${{ steps.versioning.outputs.NEW_VERSION }}.dmg"

      - name: Commit & Push Version Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add VERSION Info.plist Sources/Monte/Resources/Info.plist Packages/README.md
          git commit -m "chore(release): bump version to ${{ steps.versioning.outputs.TAG }} [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Create Git Tag
        run: |
          git tag -a "${{ steps.versioning.outputs.TAG }}" -m "Release ${{ steps.versioning.outputs.TAG }}"
          git push origin "${{ steps.versioning.outputs.TAG }}"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.TAG }}
          name: "Mont-E ${{ steps.versioning.outputs.TAG }}"
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            Packages/Monte-${{ steps.versioning.outputs.NEW_VERSION }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
